[project]
name = "pdf2md"
version = "0.1.0"
description = "PDF to Markdown conversion (docling) exposed as an MCP server"
readme = "README.md"
license = {text = "MIT"}
keywords = ["pdf", "markdown", "docling", "mcp", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
authors = [
    { name = "Tao-Lung Huang", email = "loucadgarbon@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docling>=2.40",
    "mcp[cli]>=1.12",
    "torch>=2.7",
    "torchvision",
    "truststore>=0.10",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
